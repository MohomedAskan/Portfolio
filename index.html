    <!-- Theme Prevention script -->
    <script>
      (function() {
        const storedTheme = localStorage.getItem('theme');
        if (storedTheme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-light-bg dark:bg-dark-bg text-slate-800 dark:text-slate-100 antialiased selection:bg-brand-500/20 selection:text-brand-500 transition-colors duration-300 min-h-screen">

  </body>
