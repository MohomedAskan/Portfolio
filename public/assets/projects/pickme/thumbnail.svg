<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pickmeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#pickmeGrad)"/>
  <!-- Map graphic outline -->
  <path d="M 100,100 Q 250,50 400,200 T 700,300" stroke="#334155" stroke-width="24" fill="none"/>
  <path d="M 200,400 Q 350,250 550,150 T 750,100" stroke="#334155" stroke-width="16" fill="none"/>
  <!-- Pin -->
  <circle cx="400" cy="200" r="16" fill="#ef4444"/>
  <circle cx="400" cy="200" r="6" fill="#ffffff"/>
  <!-- Card overlay -->
  <rect x="220" y="270" width="360" height="150" rx="16" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="250" y="305" font-family="sans-serif" font-weight="800" font-size="16" fill="#ffffff">PickMe Redesign Concept</text>
  <text x="250" y="330" font-family="sans-serif" font-size="12" fill="#94a3b8">Location Snap & Fare Transparency</text>
  <!-- Vehicle License Badge -->
  <rect x="250" y="350" width="140" height="36" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="320" y="373" font-family="monospace" font-weight="700" font-size="14" fill="#fbbf24" text-anchor="middle">CAB - 8492</text>
  <rect x="420" y="350" width="130" height="36" rx="18" fill="#ef4444"/>
  <text x="485" y="373" font-family="sans-serif" font-weight="700" font-size="12" fill="#ffffff" text-anchor="middle">Confirm Ride</text>
</svg>
